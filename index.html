<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lead Desk — Mini CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root{
        --rail:#0E3B43; --rail-2:#14545F; --rail-ink:#CFE3E2;
        --paper:#F4F6F5; --card:#FFFFFF; --ink:#0F1E1C; --ink-soft:#5C6B68;
        --line:#D8DEDC; --line-soft:#E8ECEA;
        --amber:#C67F17; --amber-bg:#FBF0DC;
        --blue:#2F6E93;  --blue-bg:#E4EEF5;
        --green:#22765A; --green-bg:#DFF0E8;
        --clay:#96473F;  --clay-bg:#F6E5E2;
        --shadow:0 1px 0 rgba(15,30,28,.05), 0 8px 24px -16px rgba(15,30,28,.4);
      }
      @media (prefers-color-scheme: dark){
        :root{
          --rail:#08262C; --rail-2:#10434C; --rail-ink:#BCD6D4;
          --paper:#0C1514; --card:#131F1E; --ink:#E6EDEB; --ink-soft:#93A5A2;
          --line:#263635; --line-soft:#1C2827;
          --amber:#E4A94A; --amber-bg:#31260F;
          --blue:#6FAACB; --blue-bg:#122733;
          --green:#5FB893; --green-bg:#0F2A21;
          --clay:#CF8880; --clay-bg:#2E1A18;
        }
      }
      *{box-sizing:border-box}
      body{
        margin:0; background:var(--paper); color:var(--ink);
        font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:15px; line-height:1.5;
        -webkit-font-smoothing:antialiased;
      }
      h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:700;margin:0;letter-spacing:-.015em}
      button,input,select,textarea{font:inherit;color:inherit}
      button{cursor:pointer}
      :focus-visible{outline:2px solid var(--rail-2);outline-offset:2px;border-radius:3px}
      a{color:inherit}

      .empty{padding:64px 24px;text-align:center;color:var(--ink-soft)}
      .empty h3{font-size:17px;color:var(--ink);margin-bottom:6px}
      .sub{font-size:13px;color:var(--ink-soft)}
      .num{font-variant-numeric:tabular-nums;font-size:13px}
      .num.over{color:var(--clay);font-weight:600}
      .err{color:var(--clay);font-size:13px;margin:0 0 10px;min-height:18px}
      .err.banner{padding:10px 22px;margin:0}

      .field{margin-bottom:14px}
      .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:5px}
      .field input,.field select,.field textarea{
        width:100%;padding:9px 11px;background:var(--card);border:1px solid var(--line);border-radius:3px;
      }
      .field textarea{resize:vertical;min-height:76px}
      .btn{border:1px solid transparent;border-radius:3px;padding:9px 16px;background:var(--rail);color:#F4F6F5;font-weight:600;font-size:14px}
      .btn:hover{background:var(--rail-2)}
      .btn:disabled{opacity:.6;cursor:default}
      .btn-wide{width:100%;padding:11px}
      .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
      .btn-ghost:hover{background:var(--line-soft)}
      .btn-danger{background:transparent;color:var(--clay);border-color:var(--clay);margin-left:auto}
      .btn-danger:hover{background:var(--clay-bg)}

      .gate{min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--rail)}
      .gate-box{width:100%;max-width:380px;background:var(--card);border-radius:4px;padding:32px;box-shadow:0 24px 60px -30px rgba(0,0,0,.6)}
      .gate-box h1{font-size:28px}
      .gate-box .sub{margin:8px 0 20px}
      .hint{font-size:12.5px;color:var(--ink-soft);margin-top:18px;border-top:1px solid var(--line-soft);padding-top:14px}

      .shell{display:grid;grid-template-columns:232px 1fr;min-height:100dvh}
      .rail{background:var(--rail);color:var(--rail-ink);padding:20px 16px;display:flex;flex-direction:column;gap:22px}
      .brand{display:flex;align-items:baseline;gap:8px}
      .brand b{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;color:#fff}
      .brand span{font-size:11.5px;opacity:.7}
      .rail nav{display:flex;flex-direction:column;gap:2px}
      .stage{width:100%;display:flex;align-items:center;gap:9px;padding:7px 9px;background:none;border:0;border-radius:3px;color:var(--rail-ink);text-align:left}
      .stage:hover{background:rgba(255,255,255,.07)}
      .stage[aria-pressed="true"]{background:rgba(255,255,255,.13);color:#fff}
      .stage .n{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px;opacity:.85}
      .lamp{width:8px;height:8px;border-radius:50%;flex:none;background:var(--rail-ink)}
      .lamp.new{background:var(--amber)}
      .lamp.contacted{background:var(--blue)}
      .lamp.converted{background:var(--green)}
      .lamp.lost{background:var(--clay)}
      .rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px}
      .who{font-size:13px;opacity:.7;padding:0 9px}
      .linkish{background:none;border:0;color:var(--rail-ink);opacity:.75;font-size:13px;text-align:left;padding:4px 9px;border-radius:3px}
      .linkish:hover{opacity:1;background:rgba(255,255,255,.07)}

      .main{min-width:0;display:flex;flex-direction:column}
      .topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 22px;border-bottom:1px solid var(--line);background:var(--card)}
      .topbar h1{font-size:20px;margin-right:auto}
      .topbar h1 em{font-style:normal;color:var(--ink-soft);font-weight:500;font-size:14px;font-family:"IBM Plex Sans",sans-serif;margin-left:8px}
      .search{padding:8px 11px;border:1px solid var(--line);border-radius:3px;background:var(--card);width:220px}
      .filter{padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:var(--card)}

      .tablewrap{flex:1;overflow-x:auto;padding-bottom:60px}
      table{width:100%;border-collapse:collapse;min-width:720px}
      thead th{text-align:left;font-size:12.5px;font-weight:500;color:var(--ink-soft);padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper)}
      tbody tr{border-bottom:1px solid var(--line-soft);cursor:pointer}
      tbody tr:hover{background:var(--card)}
      tbody tr[aria-selected="true"]{background:var(--card);box-shadow:inset 3px 0 0 var(--rail-2)}
      td{padding:11px 14px;vertical-align:top}
      .nm{font-weight:600}
      .pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:2px 9px 2px 7px;border-radius:2px;white-space:nowrap}
      .pill .lamp{width:6px;height:6px}
      .pill.new{background:var(--amber-bg);color:var(--amber)}
      .pill.contacted{background:var(--blue-bg);color:var(--blue)}
      .pill.converted{background:var(--green-bg);color:var(--green)}
      .pill.lost{background:var(--clay-bg);color:var(--clay)}

      .scrim{position:fixed;inset:0;background:rgba(10,25,24,.45);z-index:20}
      .panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:21;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:var(--shadow)}
      .panel-head{padding:20px 22px;border-bottom:1px solid var(--line-soft);position:relative}
      .panel-head h2{font-size:21px}
      .panel-body{flex:1;overflow-y:auto;padding:18px 22px 28px}
      .panel-foot{padding:12px 22px;border-top:1px solid var(--line-soft);display:flex;gap:8px}
      .x{position:absolute;top:14px;right:16px;background:none;border:0;font-size:22px;color:var(--ink-soft);padding:4px 8px}
      .meta{display:grid;grid-template-columns:86px 1fr;gap:6px 12px;font-size:14px;margin:0 0 20px}
      .meta dt{color:var(--ink-soft)}
      .meta dd{margin:0;word-break:break-word}
      .row{display:flex;gap:8px}
      .row .field{flex:1;margin:0}
      .sec{border-top:1px solid var(--line-soft);padding-top:16px;margin-top:18px}
      .sec h3{font-size:14px;font-weight:600;margin-bottom:10px}
      .notes{margin-top:18px}
      .note{border-left:2px solid var(--line);padding:2px 0 10px 12px;margin-bottom:12px}
      .note p{margin:0;font-size:14px;white-space:pre-wrap}
      .note time{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

      .modal{position:fixed;z-index:22;top:50%;left:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:88dvh;overflow-y:auto;background:var(--card);border-radius:4px;padding:26px;box-shadow:0 30px 70px -30px rgba(0,0,0,.6)}
      .modal h2{font-size:21px;margin-bottom:12px}
      .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
      .actions{display:flex;gap:8px;margin-top:6px}

      @media (max-width:820px){
        .shell{grid-template-columns:1fr}
        .rail{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px}
        .rail nav{flex-direction:row;width:100%;overflow-x:auto}
        .stage{width:auto;white-space:nowrap}
        .rail-foot{margin:0 0 0 auto;flex-direction:row;align-items:center}
        .topbar{padding:12px 14px}
        .topbar h1{width:100%}
        .search{flex:1;width:auto;min-width:130px}
        .grid2{grid-template-columns:1fr}
        td,thead th{padding:10px}
      }
      @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
